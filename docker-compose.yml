version: "3.9"

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: insider_app
        restart: unless-stopped
        volumes:
            - .:/var/www/html
        ports:
            - "8000:8000"
        depends_on:
            - postgres
            - redis
        environment:
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: insider_msg
            DB_USERNAME: postgres
            DB_PASSWORD: postgres
            QUEUE_CONNECTION: redis
            CACHE_STORE: redis
            REDIS_HOST: redis
            REDIS_PORT: 6379

    postgres:
        image: postgres:15
        container_name: insider_postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: insider_msg
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data

    redis:
        image: redis:7
        container_name: insider_redis
        restart: unless-stopped
        ports:
            - "6379:6379"
        volumes:
            - redisdata:/data

volumes:
    pgdata:
    redisdata:
